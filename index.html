<body>

<div class="left-sidebar">
    <div class="channel-logo"><img src="zonegirl-channel.png" alt="Zone Girl Channel"></div>
    <div class="channel-title">🎀 Zone Girl Channel</div>
    <a class="channel-link" href="https://www.youtube.com/@RelaxZone-r6x" target="_blank">🔗 訂閱 YouTube 頻道</a>
    <div class="playlist-player">
        <iframe id="playlistPlayer" src="https://www.youtube-nocookie.com/embed/videoseries?list=PLBRBEu80H-jj4vVm6pd7pj597z0Ao-lWS&autoplay=1&mute=1&rel=0" title="Zone Girl Playlist" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

        <button onclick="switchPlaylist(1)">📺 New Tsum</button>
        <button onclick="switchPlaylist(2)">🎵 Tsum Tips</button>
    </div>
</div>

<div class="container">
    <h1>🎀 Zone Girl</h1>
    <select id="language" onchange="changeLanguage()">
        <option value="hk">🇭🇰 繁體中文</option>
        <option value="tw">🇹🇼 台灣中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="jp">🇯🇵 日本語</option>
    </select>
    <h2 id="title"></h2>
    <div style="margin: 20px 0;">
        <label id="bonusText"></label>
        <input id="bonus" value="0" type="number">
    </div>
    <button onclick="calculate()"><span id="calculateText"></span></button>
    <div id="result"></div>
    <div class="note">Tsum Tsum Coin Correction Tool</div>
    
    <div class="copyright">

        <a href="LICENSE" target="_blank">查看授權條款</a>
    </div>
</div>

<script>
const languageData = {
    hk: { title: "金幣補正計算機", bonus: "金幣補正", calculate: "✨ 計算", tsum: "消除 Tsum", normal: "原本", corrected: "補正後", result: "🎀 計算結果" },
    tw: { title: "金幣補正計算機", bonus: "金幣補正", calculate: "✨ 計算", tsum: "消除 Tsum", normal: "原本", corrected: "補正後", result: "🎀 計算結果" },
    en: { title: "Coin Correction Calculator", bonus: "Coin Correction", calculate: "✨ Calculate", tsum: "Tsum Cleared", normal: "Normal", corrected: "Correction", result: "🎀 Result" },
    jp: { title: "コイン補正計算機", bonus: "コイン補正", calculate: "✨ 計算", tsum: "消去ツム数", normal: "通常", corrected: "補正後", result: "🎀 結果" }
};

let text;

function getCoinPerTsum(number) {
    if (number < 4) return 0;
    if (number === 4) return 1;
    if (number >= 5 && number <= 7) return 2;
    if (number >= 8 && number <= 10) return 3;
    if (number >= 11 && number <= 14) return 5;
    if (number >= 15 && number <= 29) return 10;
    return 12;
}

function calculate() {
    let bonus = Number(document.getElementById("bonus").value);
    let table = `<h3>${text.result}</h3><table><tr><th>${text.tsum}</th><th>${text.normal}</th><th>${text.corrected}</th></tr>`;
    
    for (let i = 1; i <= 50; i++) {
        let baseCoin = 0;
        let correctCoin = 0;
        for (let j = 1; j <= i; j++) {
            let coin = getCoinPerTsum(j);
            if (coin > 0) {
                baseCoin += coin;
                correctCoin += Math.max(1, coin + bonus);
            }
        }
        table += `<tr><td>${i}</td><td>${baseCoin}</td><td class="coin">${correctCoin}</td></tr>`;
    }
    table += `</table>`;
    document.getElementById("result").innerHTML = table;
}

function changeLanguage() {
    let lang = document.getElementById("language").value;
    text = languageData[lang];
    document.getElementById("title").innerHTML = text.title;
    document.getElementById("bonusText").innerHTML = text.bonus;
    document.getElementById("calculateText").innerHTML = text.calculate;
    calculate();
}

function switchPlaylist(number) {
    const player = document.getElementById('playlistPlayer');
    if (number === 1) {
        player.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=PLBRBEu80H-jj4vVm6pd7pj597z0Ao-lWS&autoplay=1&mute=1&rel=0';
    } else {
        player.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=PLBRBEu80H-jhcBzdiv14PCaOVopa_0zl8&autoplay=1&mute=1&rel=0';
    }
}

changeLanguage();
</script>

<script>
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault(), true);
    document.addEventListener('dragstart', e => e.preventDefault(), true);
    document.addEventListener('selectstart', e => e.preventDefault(), true);

    document.addEventListener('copy', e => {
        try {
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.clearData();
                e.clipboardData.setData('text/plain', '');
            } else if (window.clipboardData) {
                window.clipboardData.clearData();
            }
            showTip('复制已被禁用');
        } catch (err) {}
    }, true);

    document.addEventListener('cut', e => e.preventDefault(), true);

    document.addEventListener('keydown', e => {
        const key = e.key ? e.key.toLowerCase() : '';
        const ctrl = e.ctrlKey || e.metaKey;
        if ((ctrl && (key === 'c' || key === 'x' || key === 's' || key === 'u')) ||
            (e.shiftKey && ctrl && key === 'i') ||
            e.key === 'F12' || e.key === 'f12') {
            e.preventDefault();
            e.stopPropagation();
            showTip('快捷鍵已被禁用');
        }
    }, true);

    document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0) sel.removeAllRanges();
    });

    const root = document.documentElement;
    function restoreSelectNone() {
        root.style.userSelect = 'none';
        root.style.webkitUserSelect = 'none';
        root.style.msUserSelect = 'none';
    }
    restoreSelectNone();
    new MutationObserver(restoreSelectNone).observe(document.documentElement, { 
        attributes: true, 
        attributeFilter: ['style', 'class'] 
    });

    function showTip(text) {
        const existing = document.querySelector('.tip');
        if (existing) {
            existing.textContent = text;
            clearTimeout(existing._t);
            existing._t = setTimeout(() => existing.remove(), 1500);
            return;
        }
        const tip = document.createElement('div');
        tip.className = 'tip';
        tip.textContent = text;
        Object.assign(tip.style, {
            position: 'fixed',
            right: '12px',
            bottom: '12px',
            background: 'rgba(0,0,0,0.85)',
            color: '#fff',
            padding: '8px 12px',
            borderRadius: '6px',
            zIndex: 99999,
            fontSize: '13px'
        });
        document.body.appendChild(tip);
        tip._t = setTimeout(() => tip.remove(), 1500);
    }
})();
</script>
