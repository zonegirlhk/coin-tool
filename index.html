<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zone Girl Coin Correction Calculator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#fff4fa;
    font-family:"Microsoft JhengHei", Arial, sans-serif;

    /* 禁止選取文字 */
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

.container{
    width:95%;
    max-width:450px;
    margin:20px auto;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
}

.zonegirl{
    width:160px;
    max-width:60%;
    margin-bottom:10px;
}

h1{
    color:#ff77b7;
    font-size:28px;
    margin:5px;
}

h2{
    color:#6fa8dc;
    font-size:20px;
}

.input-box{
    margin:20px 0;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
}

input{
    width:120px;
    padding:10px;
    font-size:22px;
    text-align:center;
    border-radius:15px;
    border:2px solid #ffc4df;
}

button{
    margin:15px;
    padding:12px 35px;
    font-size:20px;
    border:none;
    border-radius:25px;
    background:#ff9dcc;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff84bf;
}

button:active{
    transform:scale(0.95);
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:16px;
}

th{
    background:#ffe1ef;
}

td,th{
    padding:8px;
    border:1px solid #ffd1e5;
}

.coin{
    color:#e6a000;
    font-weight:bold;
}

.note{
    font-size:13px;
    color:#888;
    margin-top:15px;
}

select{
    padding:8px 12px;
    border-radius:12px;
    border:2px solid #ffc4df;
    font-size:16px;
    margin-top:10px;
}

/* YouTube 影片 */

.video-container{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    margin-top:20px;
}

.video-container iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border-radius:20px;
    border:none;
}

</style>
</head>

<body>

<div class="container">

<img src="zonegirl.png" class="zonegirl" alt="Zone Girl">

<h1>🎀 Zone Girl</h1>

<select id="language" onchange="changeLanguage()">
    <option value="hk">🇭🇰 繁體中文</option>
    <option value="tw">🇹🇼 台灣中文</option>
    <option value="en">🇺🇸 English</option>
    <option value="jp">🇯🇵 日本語</option>
</select>

<h2 id="title"></h2>

<div class="input-box">
    <label id="bonusText"></label>
    <input id="bonus" value="0" type="number">
</div>

<button onclick="calculate()">
    <span id="calculateText"></span>
</button>

<div id="result"></div>

<div class="note">
    Tsum Tsum Coin Correction Tool
</div>

<hr style="margin:25px 0;border:none;border-top:1px solid #ffd1e5;">

<h3 style="color:#ff77b7;">🎬 Zone Girl Channel</h3>

<div class="video-container">
    <iframe
        src="https://youtu.be/J4rGAdlrMoc?si=CEgM0yTtiO2vhXHh"
        title="Zone Girl YouTube"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<p style="margin-top:15px;">
    <a href="https://www.youtube.com/@RelaxZone-r6x"
       target="_blank"
       style="color:#ff77b7;font-weight:bold;text-decoration:none;">
       🔗 訂閱 Zone Girl YouTube 頻道
    </a>
</p>

</div>

<script>

// 語言資料
let text;

const languageData = {

hk:{
title:"Coin Correction Calculator",
bonus:"金幣補正",
calculate:"✨ 計算",
tsum:"消除 Tsum",
normal:"原本",
corrected:"補正後",
result:"🎀 計算結果"
},

tw:{
title:"Coin Correction Calculator",
bonus:"金幣補正",
calculate:"✨ 計算",
tsum:"消除 Tsum",
normal:"原本",
corrected:"補正後",
result:"🎀 計算結果"
},

en:{
title:"Coin Correction Calculator",
bonus:"Coin Correction",
calculate:"✨ Calculate",
tsum:"Tsum Cleared",
normal:"Normal",
corrected:"Correction",
result:"🎀 Result"
},

jp:{
title:"コイン補正計算機",
bonus:"コイン補正",
calculate:"✨ 計算",
tsum:"消去ツム数",
normal:"通常",
corrected:"補正後",
result:"🎀 結果"
}

};

// 金幣規則
function getCoinPerTsum(number){

    if(number < 4) return 0;
    if(number == 4) return 1;
    if(number >= 5 && number <= 7) return 2;
    if(number >= 8 && number <= 10) return 3;
    if(number >= 11 && number <= 14) return 5;
    if(number >= 15 && number <= 29) return 10;

    return 12;
}

// 計算
function calculate(){

    let bonus = Number(document.getElementById("bonus").value);

    let table = `

    <h3>${text.result}</h3>

    <table>
    <tr>
        <th>${text.tsum}</th>
        <th>${text.normal}</th>
        <th>${text.corrected}</th>
    </tr>
    `;

    for(let i=1;i<=50;i++){

        let baseCoin = 0;
        let correctCoin = 0;

        for(let j=1;j<=i;j++){

            let coin = getCoinPerTsum(j);

            if(coin > 0){

                baseCoin += coin;
                correctCoin += Math.max(1, coin + bonus);
            }
        }

        table += `

        <tr>
            <td>${i}</td>
            <td>${baseCoin}</td>
            <td class="coin">${correctCoin}</td>
        </tr>
        `;
    }

    table += `</table>`;

    document.getElementById("result").innerHTML = table;
}

// 切換語言
function changeLanguage(){

    let lang = document.getElementById("language").value;

    text = languageData[lang];

    document.getElementById("title").innerHTML = text.title;
    document.getElementById("bonusText").innerHTML = text.bonus;
    document.getElementById("calculateText").innerHTML = text.calculate;

    calculate();
}

// 初始化
changeLanguage();

// 禁止右鍵
document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

// 禁止複製
document.addEventListener('copy', function(e){
    e.preventDefault();
    alert('⚠️ 此網站內容禁止複製');
});

</script>

</body>
</html>
