<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zone Girl</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#fff4fa;
    font-family:"Microsoft JhengHei", Arial, sans-serif;

    /* 禁止選取文字 */
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

.container{
    width:95%;
    max-width:450px;
    margin:20px auto;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
}

.zonegirl{
    width:160px;
    max-width:60%;
    margin-bottom:10px;
}

h1{
    color:#ff77b7;
    font-size:28px;
    margin:5px;
}

h2{
    color:#6fa8dc;
    font-size:20px;
}

.input-box{
    margin:20px 0;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
}

input{
    width:120px;
    padding:10px;
    font-size:22px;
    text-align:center;
    border-radius:15px;
    border:2px solid #ffc4df;
}

button{
    margin:15px;
    padding:12px 35px;
    font-size:20px;
    border:none;
    border-radius:25px;
    background:#ff9dcc;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff84bf;
}

button:active{
    transform:scale(0.95);
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:16px;
}

th{
    background:#ffe1ef;
}

td,th{
    padding:8px;
    border:1px solid #ffd1e5;
}

.coin{
    color:#e6a000;
    font-weight:bold;
}

.note{
    font-size:13px;
    color:#888;
    margin-top:15px;
}

select{
    padding:8px 12px;
    border-radius:12px;
    border:2px solid #ffc4df;
    font-size:16px;
    margin-top:10px;
}

/* YouTube 影片 */

.video-container{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    margin-top:20px;
}

.video-container iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border-radius:20px;
    border:none;
}

</style>
</head>

<body>

<div class="container">




<div style="
        background:#fff3cd;
        color:#856404;
        padding:12px;
        border-radius:12px;
        margin-bottom:15px;
        font-weight:bold;
        border:1px solid #ffe69c;
    ">
        🚧 網站維護中，部分功能正在更新。
    </div>





<img src="zonegirl1.png" class="zonegirl" alt="Zone Girl">

<h1>🎀 Zone Girl</h1>

<select id="language" onchange="changeLanguage()">
    <option value="hk">🇭🇰 繁體中文</option>
    <option value="tw">🇹🇼 台灣中文</option>
    <option value="en">🇺🇸 English</option>
    <option value="jp">🇯🇵 日本語</option>
</select>

<h2 id="title"></h2>

<div class="input-box">
    <label id="bonusText"></label>
    <input id="bonus" value="0" type="number">
</div>

<button onclick="calculate()">
    <span id="calculateText"></span>
</button>

<div id="result"></div>

<div class="note">
    Tsum Tsum Coin Correction Tool
</div>

<hr style="margin:25px 0;border:none;border-top:1px solid #ffd1e5;">

<h3 style="color:#ff77b7;">🎬 Zone Girl Channel</h3>

<div class="video-container">
    <iframe
	width="560"
        height="315"
        src="https://www.youtube.com/embed/7BqI22eRmmc?autoplay=1&mute=1&loop=1&playlist=7BqI22eRmmc&rel=0&modestbranding=1"
        title="Zone Girl YouTube"
	frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
</div>

<p style="margin-top:15px;">
    <a href="https://www.youtube.com/@RelaxZone-r6x"
       target="_blank"
       style="color:#ff77b7;font-weight:bold;text-decoration:none;">
       🔗 訂閱 Zone Girl YouTube 頻道
    </a>
</p>

</div>



// 禁止右鍵
document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

// 禁止複製
document.addEventListener('copy', function(e){
    e.preventDefault();
    alert('⚠️ 此網站內容禁止複製');
});

</script>

</body>
</html>
